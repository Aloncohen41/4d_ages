name: CI

# Every push to main and every pull request: is the project complete, does it typecheck, do the logic tests pass?
# The Release workflow runs this same file first (workflow_call), so nothing is released that fails here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Check, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Setup check
        run: npm run check

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test
